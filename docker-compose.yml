services:
  imate-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=ImateDB;User Id=sa;Password=Imate@123456;TrustServerCertificate=True;
      - BackendUrl=http://localhost:8080
      - FrontendSettings__BaseUrl=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  imate-frontend:
    build:
      context: ../Imate-FrontEnd/imate_frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - imate-api

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Imate@123456
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Imate@123456 -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
    name: imate-db-data-dev